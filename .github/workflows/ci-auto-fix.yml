name: Auto Fix CI

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]

jobs:
  auto-fix:
    if: |
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.pull_requests[0] &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Check for previous auto-fix attempt
        id: guard
        run: |
          AUTHOR_EMAIL=$(git log -1 --format='%ae')
          if [[ "$AUTHOR_EMAIL" == "41898282+github-actions[bot]@users.noreply.github.com" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure git identity
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Enable pnpm via corepack
        if: steps.guard.outputs.skip != 'true'
        run: corepack enable pnpm

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Get CI failure details
        if: steps.guard.outputs.skip != 'true'
        id: failure
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const jobs = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: process.env.RUN_ID * 1
            });
            const failedJobs = jobs.data.jobs.filter(j => j.conclusion === 'failure');
            const MAX_LOG_CHARS = 10000;
            let errorLogs = [];
            for (const job of failedJobs) {
              const logs = await github.rest.actions.downloadJobLogsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: job.id
              });
              // @octokit/rest follows the 302 redirect and returns plain text in data
              const fullLog = logs.data;
              const truncated = fullLog.length > MAX_LOG_CHARS
                ? '...(truncated)\n' + fullLog.slice(-MAX_LOG_CHARS)
                : fullLog;
              errorLogs.push({ jobName: job.name, logs: truncated });
            }
            return {
              failedJobs: failedJobs.map(j => j.name),
              errorLogs
            };

      - name: Fix CI failures with Claude
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1.0.159
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --allowed-tools "Read,Edit,Write,Glob,Grep,Bash(git add *),Bash(git commit *),Bash(git push origin *),Bash(git status *),Bash(git diff *),Bash(pnpm test),Bash(pnpm test *),Bash(gh pr comment *),Bash(gh pr view *)"'
          prompt: |
            CI テストが失敗しました。エラーログを分析して修正し、このブランチにプッシュしてください。

            PR: #${{ github.event.workflow_run.pull_requests[0].number }}
            ブランチ: ${{ github.event.workflow_run.head_branch }}
            失敗ジョブ: ${{ join(fromJSON(steps.failure.outputs.result).failedJobs, ', ') }}

            エラーログ:
            ${{ toJSON(fromJSON(steps.failure.outputs.result).errorLogs) }}

            手順:
            1. エラーの原因を特定する
            2. `gh pr view` で PR の内容を確認し、変更の文脈を把握する
            3. コードを修正する（スナップショット更新が必要な場合は `pnpm test -- -u` を実行）
            4. `pnpm test` で修正を検証する
            5. 変更をコミットして `git push origin HEAD:refs/heads/${{ github.event.workflow_run.head_branch }}` でプッシュする

            コミットメッセージは英語で Conventional Commits 形式にしてください。
            修正内容を PR にコメントしてください。

            ---
            🤖 モデル: [実際のモデル名] / 💰 コスト: 入力[N]トークン, 出力[M]トークン, $[金額]
