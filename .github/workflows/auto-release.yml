name: Release

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      # push は branches: [main] でフィルタ済みだが、workflow_dispatch 用に明示ガード
      - name: Validate branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::このワークフローは main ブランチからのみ実行できます (現在: ${{ github.ref }})"
          exit 1

  create-release:
    needs: validate-branch
    permissions:
      contents: write
    uses: rysk-tanaka/workflows/.github/workflows/release-on-version-change.yml@7f73594c4b695aa8b4b6619cc21c7e57143285e2 # main
    with:
      version_source: package_json
      tag_prefix: v
      # workflow_dispatch is a retry scenario: tag/release already exist but
      # downstream publish jobs (npm, Docker, major tag) may have failed.
      # Force released=true so those jobs run again.
      force_released_output: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit

  update-major-tag:
    needs: create-release
    if: needs.create-release.outputs.released == 'true' && vars.PUBLISH_ACTION == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update major version tag
        run: |
          set -euo pipefail
          MAJOR="v$(jq -r '.version' package.json | cut -d. -f1)"
          if [[ ! "$MAJOR" =~ ^v[0-9]+$ ]]; then
            echo "::error::Invalid major version tag: $MAJOR"
            exit 1
          fi
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force

  npm:
    needs: create-release
    if: needs.create-release.outputs.released == 'true' && vars.PUBLISH_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm exchanges this job's OIDC token for the publish, so no npm
      # token is stored in the repository. npmjs.com trusts auto-release.yml of this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 ships npm 11.5.1 or later, which trusted publishing needs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm publish, not pnpm publish: the npm CLI does the OIDC exchange and attaches provenance.
      # The package has no build step or workspace dependencies, so nothing is installed first.
      - name: Publish to npm
        run: |
          PKG_NAME=$(jq -r '.name' package.json)
          PKG_VERSION=$(jq -r '.version' package.json)
          npm publish --access public || {
            if npm view "${PKG_NAME}@${PKG_VERSION}" version > /dev/null 2>&1; then
              echo "Version ${PKG_VERSION} already published, skipping"
            else
              exit 1
            fi
          }

  docker:
    needs: create-release
    if: needs.create-release.outputs.released == 'true' && vars.PUBLISH_DOCKER == 'true'
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker-publish.yml
