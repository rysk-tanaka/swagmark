name: Docker

# Builds the image of the latest release, scans it, and publishes it to GHCR.
# - Release: called from auto-release.yml when a release is created.
# - Weekly: rebuilds the same release on the current base image, so the published tags do not
#   keep the OS packages of the day of the release. Renovate updates the base image digest in the
#   Dockerfile on main, so the Dockerfile is taken from the commit this workflow runs on, while the
#   application code comes from the release tag.
# - Pull request: builds and scans the Dockerfile of the branch without publishing.

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 0"
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/docker-publish.yml

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      IS_PUBLISH: ${{ github.event_name != 'pull_request' }}
    steps:
      - name: Resolve the release to build
        id: release
        if: env.IS_PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo "$REPO" --json tagName --jq .tagName)
          if [[ ! "$TAG" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected tag of the latest release: $TAG"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "major=v${BASH_REMATCH[1]}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      # The Dockerfile of a release tag keeps the base image digest of the day of the release.
      - name: Check out the Dockerfile of the workflow's commit
        if: env.IS_PUBLISH == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .docker-build
          sparse-checkout: Dockerfile
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the Dockerfile and the source revision
        id: build
        env:
          IS_PUBLISH: ${{ env.IS_PUBLISH }}
        run: |
          set -euo pipefail
          if [[ "$IS_PUBLISH" == "true" ]]; then
            echo "dockerfile=.docker-build/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "dockerfile=Dockerfile" >> "$GITHUB_OUTPUT"
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the image for checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.build.outputs.dockerfile }}
          load: true
          tags: swagmark:check
          cache-from: type=gha

      # Absolute paths, so the check also runs on releases built before the Dockerfile set WORKDIR.
      - name: Convert the example with the image
        run: |
          set -euo pipefail
          docker run --rm swagmark:check --version
          docker run --rm -v "$PWD/examples/petstore:/samples:ro" swagmark:check \
            /samples/petstore.yaml -o /tmp/out

      - name: Scan the image
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: swagmark:check
          # Stop only for vulnerabilities that a rebuild or an update can fix.
          severity-cutoff: critical
          only-fixed: true
          fail-build: true
          output-format: sarif

      - name: Upload the scan to code scanning
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: container-image

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.IS_PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image
        id: push
        if: env.IS_PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ steps.build.outputs.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.release.outputs.major }}
            ${{ env.IMAGE }}:latest
          # The provenance names the workflow's commit; these name the release that was built.
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.tag }}
            org.opencontainers.image.revision=${{ steps.build.outputs.revision }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Lets anyone check which commit and workflow built the image:
      # gh attestation verify oci://ghcr.io/rysk-tanaka/swagmark:latest --owner rysk-tanaka
      - name: Attest the build provenance
        if: env.IS_PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          # Storage records are only for organization-owned repositories.
          create-storage-record: false
