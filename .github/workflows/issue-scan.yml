name: Issue Scan

on:
  schedule:
    # 09:50 JST (00:50 UTC): GitHub Actions schedule は数時間の遅延が発生するため、
    # クレジット 5h 枠の切り替わり後（10:00 JST 以降）に実行されるよう余裕を持たせた設定
    - cron: "50 0 * * *"
  workflow_dispatch:

concurrency:
  group: issue-scan
  cancel-in-progress: false

jobs:
  scan:
    permissions:
      issues: write
      contents: read
      id-token: write
    uses: rysk-tanaka/workflows/.github/workflows/issue-scan.yml@0ed8310f0b190bd5bbc1de3d8475c2fae639fa79 # main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
